sonar.projectKey=note-app
sonar.projectName=Note App
sonar.projectVersion=1.0

sonar.sources=frontend/src,backend/src
sonar.tests=frontend/src/test,backend/src/test

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/prisma/**,\
  **/generated/**,\
  backend/src/generated/**,\
  backend/src/server.ts,\
  **/*.d.ts,\
  frontend/src/main.tsx,\
  frontend/src/vite-env.d.ts,\
  frontend/src/test/**,\
  backend/src/test/**

