  **/node_modules/**,\
  **/dist/**

sonar.javascript.lcov.reportPaths=\
  frontend/coverage/lcov.info,\
  backend/coverage/lcov.info

sonar.typescript.tsconfigPaths=\
  frontend/tsconfig.app.json,\
  backend/tsconfig.json

sonar.host.url=http://localhost:9000
